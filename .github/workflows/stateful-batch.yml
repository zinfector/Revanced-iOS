name: Larger source translated batch
on:
  push:
    branches: [feat/stateful-batch-0.2]
permissions:
  contents: read
jobs:
  batch:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          path: j2objc
          key: j2objc-1671e9a-xcode164-jdk21-full-host-ios-v1
          restore-keys: j2objc-1671e9a-xcode164-jdk21-core-host-ios-v2
      - name: Build pinned translator and complete runtime
        run: |
          set -o pipefail
          mkdir -p batch-output
          if [ ! -d j2objc/.git ]; then
            git clone --depth 1 --branch 3.1 https://github.com/google/j2objc.git j2objc
          fi
          test "$(git -C j2objc rev-parse HEAD)" = 1671e9afb72a16126d448f468db3e582358fba47
          make -C j2objc -j3 translator_dist 2>&1 | tee batch-output/vendor-translator.log
          make -C j2objc/jre_emul -j3 J2OBJC_ARCHS="macosx macosx64 iphone64" dist_includes ../dist/lib/macosx/libjre_emul.a ../dist/lib/iphone/libjre_emul.a ../dist/lib/macosx/libjson.a ../dist/lib/iphone/libjson.a 2>&1 | tee batch-output/vendor-runtime.log
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: j2objc
          key: j2objc-1671e9a-xcode164-jdk21-full-host-ios-v1
      - name: Fetch pinned ICU C headers
        run: |
          git init icu-headers
          git -C icu-headers remote add origin https://github.com/unicode-org/icu.git
          git -C icu-headers sparse-checkout init --cone
          git -C icu-headers sparse-checkout set icu4c/source/common/unicode icu4c/source/i18n/unicode
          git -C icu-headers fetch --depth 1 --filter=blob:none origin 8eca245c7484ac6cc179e3e5f7c1ea7680810f39
          git -C icu-headers checkout --detach FETCH_HEAD
          test "$(git -C icu-headers rev-parse HEAD)" = 8eca245c7484ac6cc179e3e5f7c1ea7680810f39
      - name: Translate, execute and compile ARM64 iOS
        run: python batch-delivery/native_build.py --j2objc-home j2objc/dist --input batch-delivery/java --native batch-delivery/native --out batch-output/native --icu-headers icu-headers
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: larger-translated-batch
          path: batch-output
          retention-days: 14
