name: Build DeArrow text nodes with Xcode

on:
  push:
    branches: [fix/dearrow-text-nodes-0.3.62]

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: patcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Build ARM64 iOS payload with established Xcode toolchain
        run: python build.py
      - name: Record compiler and cloud build provenance
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          provenance = {
              'head_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'clang': subprocess.check_output(['xcrun', '--sdk', 'iphoneos', 'clang', '--version'], text=True).strip(),
              'tests_run': False,
          }
          Path('build/cloud-build.json').write_text(json.dumps(provenance, indent=2)+'\n')
          PY
      - name: Upload compiled payload and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-build
          path: |
            patcher/build/RVPort.dSYM.zip
            patcher/build/RVPort.dylib
            patcher/build/build-manifest.json
            patcher/build/build.log
            patcher/build/cloud-build.json
          if-no-files-found: error
          retention-days: 7
